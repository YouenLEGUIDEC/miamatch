name: Vérifier la connexion Expo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/expo-access.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vérifier le compte autorisé
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo 'Ajoutez le secret GitHub EXPO_TOKEN, puis relancez cette vérification.'
            exit 1
          fi
          expo_account=$(node node_modules/expo/bin/cli whoami)
          if [ "${expo_account,,}" != "youen_lg" ]; then
            echo 'Le jeton doit appartenir au compte Expo Youen_LG.'
            exit 1
          fi
          echo 'Connexion Expo Youen_LG vérifiée. Aucun build lancé.'
